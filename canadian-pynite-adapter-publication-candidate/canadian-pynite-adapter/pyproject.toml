[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canadian-pynite-adapter"
version = "0.2.0.dev1"
description = "Experimental first-order PyNite adapter with bounded Canadian load-combination helpers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["PyNiteFEA==3.2.0", "numpy>=2.4.0"]

[tool.setuptools.packages.find]
include = ["octo_pynite*"]
